[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagent-enterprise-harness"
version = "0.1.0"
description = "Tenant-scoped DeepAgents enterprise harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.32,<0.8",
    "langchain>=1.4.7,<2",
    "langgraph>=1.2.17,<2",
    "fastapi>=0.162.0,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "sqlalchemy[asyncio]>=2.1.3,<3",
    "uvicorn>=0.54.0,<1",
    "httpx>=0.28.1,<1",
    "pyjwt>=2.15.1,<3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langfuse>=5.0.2,<6",
    "langchain-openai>=1,<2",
    "langchain-anthropic>=1,<2",
    "pyyaml>=6,<7",
    "langchain-core>=1.7.0",
    "cached-property>=2.0.1",
    "agentfactory>=0.0.0",
    "openai>=3.37.0",
    "asyncio>=4.0.0",
    "langgraph-checkpoint-redis>=0.5.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pgvector>=0.5.1",
    "alembic>=1.20.1",
    "modelscope>=1.40.2",
    "ipykernel>=7.4.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.6",
    "redis>=8.1.0",
    "sqlalchemy-transactional>=1.0.3",
    "sse-starlette>=3.6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3,<4", "langgraph-checkpoint-postgres>=3,<4"]
redis = [
    "redis>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.2,<1", "mypy>=1,<2", "types-PyYAML>=6"]

[project.scripts]
harness-api = "agent_platform.interface.api.app:main"
harness-worker = "agent_platform.workers.agent_task_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_platform"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:agent_platform.*"]
