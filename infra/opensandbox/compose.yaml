services:
  opensandbox:
    image: opensandbox/server:release-1.2.0
    restart: unless-stopped
    # 面向 Linux Docker Engine；仅管理服务使用 host 网络。
    network_mode: host
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ./sandbox.toml
        target: /etc/opensandbox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - opensandbox_data:/var/lib/opensandbox
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  opensandbox_data:
